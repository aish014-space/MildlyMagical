<style>
  :root {
    --navy-deep: #0E0F28;
    --navy: #131741;
    --navy-light: #08383F;
    --jungle: #29AB87;

    --ink: #F1E6D0;
    --muted: #C9B993;

    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html { font-size: 100%; }
  button { font-family: inherit; }
  body {
    background: var(--navy);

  main {

    padding: 40px 16px 56px;
    text-align: center;
    position: relative;
  }
  /* Bokeh dots: soft, glowing, gold */
  .star, .spark, .rule i, .burst {
    display: block;
    border-radius: 50%;

    box-shadow: 0 0 10px rgba(176, 138, 62, 0.3);
    pointer-events: none;
    user-select: none;
  }
  .star { position: absolute; width: 9px; height: 9px; opacity: 0.45; filter: blur(0.4px); }
  .star.one { top: 36px; left: 9%; }
  .star.two { top: 150px; right: 8%; width: 7px; height: 7px; }
  .star.three { top: 330px; left: 5%; width: 16px; height: 16px; opacity: 0.22; filter: blur(2px); }
  .star.four { top: 250px; right: 4%; width: 22px; height: 22px; opacity: 0.16; filter: blur(3px); }

    .star.three { animation-delay: 1s; animation-duration: 8s; }
    .star.four { animation-delay: 3s; animation-duration: 9s; }
    .star.five { animation-delay: 4s; }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.55; }
  }

  .sparkles { position: relative; display: inline-block; isolation: isolate; }
  .sparkles::before {
    content: "";
    position: absolute; left: 50%; top: 50%; z-index: -1;
    width: 170%; aspect-ratio: 1.5;
    transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, rgba(176, 138, 62, 0.16), rgba(176, 138, 62, 0.06) 55%, transparent);
    pointer-events: none;
  }
  .spark { position: absolute; opacity: 0.8; filter: blur(0.5px); }
  .spark.s1 { top: 12%; left: -24%; width: 12px; height: 12px; }
  .spark.s3 { bottom: 10%; left: -12%; width: 7px; height: 7px; }
  .spark.s4 { top: 2%; right: -14%; width: 9px; height: 9px; }
  @media (prefers-reduced-motion: no-preference) {
    .spark { animation: glint 3.6s ease-in-out infinite; }
    .spark.s3 { animation-delay: 1.8s; } .spark.s4 { animation-delay: 2.5s; }
  }
  @keyframes glint {
    0%, 100% { opacity: .3; transform: scale(.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }
  .burst { position: fixed; z-index: 10; }
  .rule { display: flex; justify-content: center; align-items: center; gap: 16px; margin: 18px 0 0; }
  .rule i { width: 6px; height: 6px; filter: blur(0.4px); }
  .rule i:nth-child(2) { width: 9px; height: 9px; }

  @media (min-width: 820px) {
    html { font-size: 118%; }
    main { max-width: 720px; padding-top: 56px; }
  }

  .nojs { margin: 40px 0; font-size: 1.2rem; color: var(--ink); }

  .hello { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--ink); }
  .tease { margin: 6px 0 0; font-size: 1.05rem; color: var(--muted); min-height: 2.8em; }

  .count.is-text { font-size: clamp(2.6rem, 13vw, 4.4rem); line-height: 1.1; letter-spacing: 0; }
  .cake { margin: 10px 0 0; }

  .footnote { margin: 10px 0 0; font-size: 1.05rem; color: var(--muted); }

  .card::before {
    content: "";
    position: absolute; top: -13px; left: 50%; z-index: 2;

    padding: 1.45rem 1.1rem 1.35rem;

    background:

      repeating-linear-gradient(0deg, rgba(120, 90, 50, 0.05) 0 1px, transparent 1px 3px),
      linear-gradient(135deg, #BFA574, #AF9566);
    box-shadow: inset 0 0 0 1px rgba(110, 75, 30, 0.22);
    clip-path: polygon(0.0% 0.7%, 5.2% 1.5%, 10.1% 0.8%, 15.3% 0.3%, 20.4% 1.0%, 26.3% 0.2%, 30.7% 0.1%, 36.6% 1.1%, 40.2% 1.6%, 46.6% 1.0%, 52.0% 0.3%, 55.5% 0.8%, 59.2% 0.3%, 63.4% 0.0%, 68.3% 0.7%, 74.3% 0.8%, 79.7% 0.8%, 85.2% 0.7%, 89.6% 1.6%, 96.1% 1.3%, 100.0% 0.4%, 99.7% 4.0%, 99.9% 11.4%, 99.5% 21.3%, 99.5% 31.5%, 98.9% 42.3%, 99.7% 48.3%, 99.4% 58.9%, 99.5% 69.8%, 99.2% 76.1%, 99.6% 86.0%, 99.6% 92.4%, 99.1% 99.8%, 96.0% 99.4%, 93.2% 99.9%, 88.3% 99.6%, 84.1% 98.9%, 81.1% 98.2%, 78.2% 98.5%, 75.3% 99.0%, 72.2% 99.4%, 66.8% 98.1%, 63.3% 97.9%, 60.2% 99.1%, 55.2% 98.5%, 52.4% 97.6%, 49.2% 99.4%, 44.4% 99.2%, 41.0% 99.8%, 38.2% 98.6%, 35.0% 98.6%, 31.4% 98.9%, 26.0% 98.8%, 21.8% 97.9%, 18.7% 99.6%, 13.5% 98.0%, 10.3% 99.5%, 5.6% 97.7%, 2.5% 97.7%, 0.9% 99.2%, 0.5% 94.0%, 2.7% 90.4%, 2.0% 86.0%, 2.3% 81.6%, 1.0% 76.0%, 2.1% 71.9%, 0.8% 68.2%, 2.4% 62.7%, 0.9% 57.1%, 0.7% 50.4%, 0.9% 46.8%, 0.4% 41.8%, 1.2% 37.6%, 0.5% 32.1%, 2.5% 27.4%, 1.9% 20.4%, 1.7% 14.5%, 0.3% 10.5%, 2.6% 7.0%);
  }
  .paper::after {
    content: "";
    position: absolute; inset: 11px;
    border: 1px solid rgba(139, 101, 20, 0.5);
    border-radius: 3px;
    pointer-events: none;
  }
  .book { width: 90%; margin: 32px auto 0; padding: 16px 14px 18px; border: 1.5px dashed rgba(176, 138, 62, 0.5); border-radius: 16px; }
  .book h2 { margin: 0; font-size: 1.6rem; font-weight: 700; color: var(--gold); }
  .book-sub { margin: 2px 0 14px; font-size: 1.05rem; color: var(--muted); }
  .stickers { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 8px; }
  .sticker-wrap { position: relative; width: 2.35rem; height: 2.35rem; border-radius: 50%; cursor: default; }
  .sticker-wrap:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .sticker { width: 100%; height: 100%; transform: rotate(var(--r, 0deg)); filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.55)); transition: transform 0.15s; }
  .sticker-wrap:hover .sticker, .sticker-wrap:focus-visible .sticker { transform: rotate(var(--r, 0deg)) scale(1.18); }
  .sticker svg { display: block; width: 100%; height: 100%; }
  .sticker .bg { fill: var(--sb, #1E3B2A); }
  .sticker .bgs { stroke: var(--sb, #1E3B2A); }
  .sticker.pop { animation: peel 0.55s ease-out both; }
  @keyframes peel {
    from { transform: rotate(var(--r, 0deg)) scale(1.8); opacity: 0; }
    to { transform: rotate(var(--r, 0deg)) scale(1); opacity: 1; }
  }
  .tip {
    position: absolute; left: 50%; bottom: calc(100% + 8px); z-index: 5;
    transform: translateX(calc(-50% + var(--dx, 0px)));
    width: max-content; max-width: 13rem;
    padding: 5px 12px 6px; border-radius: 6px;
    background: #C4AA79; color: #2B1A22; border: 1px solid #A67C16;
    font-size: 1.02rem; line-height: 1.2; text-align: center;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.15s;
  }
  .tip b { display: block; font-size: 1.1rem; }
  .tip i { display: block; font-style: normal; color: #5C3A12; margin-top: 2px; }
  .sticker-wrap:hover .tip, .sticker-wrap:focus .tip { opacity: 1; visibility: visible; }
  .ghost .sticker { filter: none; }
  .ghost svg { opacity: var(--go, 0.25); }
  .ghost .bg { fill: transparent; stroke-dasharray: 3 2.6; }
  .ghost:hover .sticker, .ghost:focus-visible .sticker { transform: rotate(var(--r, 0deg)); }
  @media (prefers-reduced-motion: reduce) { .sticker.pop { animation: none; } }

  .tiers {
    display: inline-flex; gap: 2px; padding: 3px; margin-bottom: 16px;
    background: rgba(92, 18, 38, 0.08);
    border: 1px solid var(--gold);
    border-radius: 999px;
  }
  .tier {
    font-weight: 700; font-size: 0.95rem;
    padding: 6px 18px; border-radius: 999px;
    border: 0; background: transparent; color: var(--muted);
    cursor: pointer;
    transition: background .2s, color .2s, box-shadow .2s;
  }
  .tier:hover:not([aria-pressed="true"]) { color: var(--ink); }
  .tier[aria-pressed="true"] { background: var(--burgundy); color: #CDAA58; box-shadow: 0 1px 4px rgba(19, 25, 54, 0.4); }
  .takes { margin: 0; font-size: 1.05rem; letter-spacing: 0.02em; color: var(--burgundy); }
  .task { margin: 8px 0 20px; font-weight: 400; font-size: 1.15rem; line-height: 1.45; min-height: 5.2em; display: flex; align-items: center; justify-content: center; }
  .task.is-done { opacity: 0.6; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn {
    font-weight: 700; font-size: 1rem;
    padding: 12px 22px; border-radius: 16px;
    border: 1.5px solid transparent;
    cursor: pointer; color: #CDAA58;
    transition: transform .15s, box-shadow .15s, background .2s;
  }
  .btn.primary {
    background: linear-gradient(180deg, #641830 0%, var(--burgundy) 100%);
    border-color: var(--gold);
    box-shadow: 0 3px 0 rgba(19, 25, 54, 0.45), 0 6px 16px rgba(92, 18, 38, 0.5), 0 0 0 2px rgba(176, 138, 62, 0.35);
  }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    border-color: var(--gold);
    border-style: dashed;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn.ghost:hover { background: rgba(92, 18, 38, 0.08); }
  .btn.primary:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(15, 30, 56, 0.35); }
  .btn.ghost:active { transform: translateY(1px); }
  .btn:focus-visible, .tier:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .btn, .tier { transition: none; } .btn:hover:not(:disabled), .btn:active:not(:disabled) { transform: none; } }
  .thanks { margin: 14px 0 0; min-height: 1.5em; color: var(--ink); font-size: 1.1rem; white-space: pre-line; }

  .moon { margin: 30px 0 0; font-size: 1.15rem; color: var(--muted); }
  .moon b { color: var(--ink); font-weight: normal; }
  .moonpic { display: block; margin: 0 auto 8px; }
  .moonpic svg { display: block; margin: 0 auto; width: 2.55rem; height: 2.55rem; filter: drop-shadow(0 0 10px rgba(224, 198, 128, 0.35)); }
  .ask { margin: 34px 0 0; font-size: 1.1rem; color: var(--muted); }
  .ask a { color: var(--gold); text-decoration: underline; text-underline-offset: 3px; }
  .ask a:hover { color: var(--ink); }
  .ask a:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 3px; }
  .feedback { margin: 10px 0 0; font-size: 1.05rem; color: var(--muted); }
</style>
</head>

<main>
  <noscript><p class="nojs">This page needs JavaScript to count the days and find the whimsy. Please switch it on, then come back. The kettle will wait.</p></noscript>

<script>
(function () {
  "use strict";

  // ---------- Content (all original) ----------

  // The constant: what this page stands for. Only the salutation follows the clock.
  var HELLO = {
    morning:   `Good morning, dear human. Let’s find the whimsy today.`,
    afternoon: `Good afternoon, dear human. Let’s find the whimsy today.`,
    evening:   `Good evening, dear human. Let’s find the whimsy today.`,
    night:     `Hello, night owl, dear human. Let’s find the whimsy today.`
  };

  // One per day, in order, enough to cover the whole countdown without a repeat.
  var TEASES = [
    `Today’s forecast: mostly fine, with scattered biscuits.`,
    `You have been busy all year. This tab would like to formally congratulate you.`,
    `Nothing here is urgent. That is the whole point of here.`,
    `The universe has a long to-do list too, and it still stops for a tiny break.`,
    `Somewhere a pigeon is having a worse day than you, and it is handling it with a strut.`,
    `If today were a sandwich, we are aiming for a good one. Buttered and non-soggy.`,
    `You are officially permitted to enjoy something today.`,
    `Today’s magic is small, local, and made from ingredients you already own.`,
    `Everyone else is making it up as they go along. Some are just better at confident walking.`,
    `Your list will still be there later. Lists are loyal like that.`,
    `The world has been going for four billion years and will not miss the next two minutes.`,
    `The trick to a good day is lowering the bar and then stepping over it with flair.`,
    `A little silliness is the cheapest medicine in the cupboard.`,
    `There is a small, quiet cheer going on in your honour. You may not hear it, but it is lovely.`,
    `Be gentle with yourself. You are the only version of you currently available.`,
    `Today we are aiming for “pleasantly present”, with a stretch goal of “mildly smug”.`,
    `Encouraging you to drink another coffee.`,
    `Some days run on coffee. Today runs on whimsy, with a splash of milk.`,
    `Your shoulders called. They would like to come down now.`,
    `If a goose can waddle through life with confidence, so can you.`,
    `Today’s mission is entirely optional and mostly delightful.`,
    `Spare a thought for the humble Tuesday, which never gets any credit. Today, it does.`,
    `You are made of stardust and snack crumbs. Both deserve respect.`,
    `The year has been long. The next two minutes are short. Spend them well.`,
    `Somewhere a cat is judging nothing at all, and thriving. Aspire to this.`,
    `A day without a small delight is like a pot without a lid: possible, but drippy.`,
    `You do not have to be productive to be worthwhile. Terrible news for productivity, wonderful news for you.`,
    `There is a pocket of quiet in every day. Today’s is right here.`,
    `Be kind to the person in the mirror. They have been up since forever.`,
    `The world is mostly made of ordinary things, and ordinary things are secretly wonderful.`,

    var upcoming = [];
    for (var u = 0; u < STICKERS.length && upcoming.length < 3; u++) if (!ownedNow[u]) upcoming.push(u);
    for (var g = 0; g < upcoming.length; g++) {
      var gdef = STICKERS[upcoming[g]];
      var gw = document.createElement("div");
      gw.className = "sticker-wrap ghost";
      gw.tabIndex = 0;
      gw.setAttribute("role", "img");
      gw.setAttribute("aria-label", "A charm still to be found");
      var ge = document.createElement("div");
      ge.className = "sticker";
      ge.style.setProperty("--r", (((g * 53 + 5) % 15) - 7) + "deg");
      ge.style.setProperty("--go", [0.34, 0.22, 0.13][g]);
      ge.style.setProperty("--sb", BASES[gdef.base] || BASES.f);
      ge.innerHTML = stickerSVG(gdef.art);
      var gt = document.createElement("span");
      gt.className = "tip";
      gt.innerHTML = "<b></b><i></i>";
      gt.firstChild.textContent = "A charm still to find";
      gt.lastChild.textContent = "Finish a small thing to reveal its power.";
      gt.setAttribute("aria-hidden", "true");
      gw.appendChild(ge);
      gw.appendChild(gt);
      gw.addEventListener("mouseenter", placeTip);
      gw.addEventListener("focus", placeTip);
      box.appendChild(gw);
    }
    $("bookSub").textContent = list.length >= STICKERS.length
      ? "All " + STICKERS.length + " powers collected. You are now, officially, a little bit magic."
      : list.length
      ? list.length + (list.length === 1 ? " power" : " powers") + " collected so far. Hover a charm to read what it does."
      : "Finish a small thing to find your first charm, and the power that comes with it.";
    $("book").hidden = (special === SPECIAL.first || special === SPECIAL.after) && !list.length;
  }

  var TIER_LABEL = { "2": "2-ish minutes", "10": "10-ish minutes" };
  var REPEAT_GAP_DAYS = 35;
  var STORE_KEY = "nearly-new-year.v1";

  // ---------- Helpers ----------

  function dayNumber(d) { return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); }
  function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function $(id) { return document.getElementById(id); }

  function loadState() {
    try {
      var s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && typeof s === "object") return s;
    } catch (e) {}
    return {};
  }
  function saveState() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  var state = loadState();
  state.seen = state.seen || {};      // seen[tier][idx] = last day shown
  state.tally = state.tally || 0;
  state.stickers = state.stickers || [];
  var today = dayNumber(new Date());
  var tier = "2";

  function startDay() {
    today = dayNumber(new Date());
    if (state.day !== today) {
      state.day = today;
      state.picks = {};
      state.done = {};
      saveState();
    }
  }

  // Tasks that involve gazing. Never on consecutive days in a length,
  // and never in both lengths on the same day.
  var STARE = /look out of a window|look at the ceiling|watch the sky/i;
  function isStare(t, idx) { return STARE.test(TASKS[t][idx]); }
  function stareBlocked(t) {
    var st = state.stare || (state.stare = {});
    var mine = st[t] || (st[t] = {});
    var prevPick = state.picks[t];
    if (mine[today - 1] || mine[today]) return true;
    if (prevPick !== undefined && isStare(t, prevPick)) return true;
    for (var o in TASKS) {
      if (o !== t && st[o] && st[o][today]) return true;
    }
    return false;
  }

  // Choose a task not shown in the last 5 weeks. The day number sets the
  // starting point, so an untouched run never repeats inside 36 days.
  function choose(t) {
    var n = TASKS[t].length;
    var seen = state.seen[t] || (state.seen[t] = {});
    var base = ((today % n) + n) % n;
    var best = -1, oldest = Infinity;
    var noStare = stareBlocked(t);
    var current = state.picks[t];
    for (var i = 0; i < n; i++) {
      var idx = (base + i) % n;
      if (noStare && isStare(t, idx)) continue;
      var last = seen[idx];
      if (last === undefined || today - last >= REPEAT_GAP_DAYS) { best = idx; break; }
      if (idx !== current && last < oldest) { oldest = last; best = idx; }
    }
    if (best < 0) best = base;
    seen[best] = today;
    if (isStare(t, best)) state.stare[t][today] = true;
    return best;
  }

  // ---------- Moon ----------

  // A small picture of the moon as it really looks tonight: craters and seas, lit on the correct side.
  function moonSVG(age, syn) {
    var k = Math.cos(2 * Math.PI * age / syn), rx = (Math.abs(k) * 46).toFixed(2), d;
    if (age < syn / 2) d = "M50 4A46 46 0 0 1 50 96A" + rx + " 46 0 0 " + (k > 0 ? 0 : 1) + " 50 4z";
    else d = "M50 4A46 46 0 0 0 50 96A" + rx + " 46 0 0 " + (k > 0 ? 1 : 0) + " 50 4z";
    var tex =
      '<g filter="url(#mBlur)" fill="#867E64" opacity=".55">' +
      '<ellipse cx="30" cy="48" rx="15" ry="20"/><circle cx="40" cy="30" r="12"/><circle cx="60" cy="33" r="8"/>' +
      '<ellipse cx="66" cy="48" rx="11" ry="8"/><ellipse cx="82" cy="40" rx="5" ry="4"/>' +
      '<ellipse cx="42" cy="68" rx="9" ry="6"/><ellipse cx="76" cy="62" rx="6" ry="8"/></g>' +
      '<g fill="#F6EFD9" opacity=".9"><circle cx="46" cy="82" r="3"/><circle cx="38" cy="45" r="2.4"/><circle cx="28" cy="42" r="1.6"/><circle cx="24" cy="36" r="1.6"/></g>' +
      '<g fill="none" stroke="#F6EFD9" stroke-width=".5" opacity=".5"><path d="M46 82L46 66M46 82L58 72M46 82L34 74M46 82L60 90"/></g>' +
      '<g fill="#6F684F" opacity=".35"><circle cx="58" cy="76" r="2"/><circle cx="68" cy="26" r="1.8"/><circle cx="52" cy="58" r="1.4"/><circle cx="20" cy="58" r="1.8"/><circle cx="72" cy="78" r="1.5"/></g>';
    return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The moon tonight">' +
      '<defs><radialGradient id="mLit" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="#FBF5E1"/><stop offset=".65" stop-color="#E3D9BA"/><stop offset="1" stop-color="#BDB08A"/></radialGradient>' +
      '<filter id="mBlur"><feGaussianBlur stdDeviation="1.2"/></filter>' +
      '<clipPath id="mLitClip"><path d="' + d + '"/></clipPath></defs>' +
      '<circle cx="50" cy="50" r="46" fill="#1E2644"/><g opacity=".2">' + tex + '</g>' +
      '<g clip-path="url(#mLitClip)"><circle cx="50" cy="50" r="46" fill="url(#mLit)"/>' + tex + '</g>' +
      '<circle cx="50" cy="50" r="46" fill="none" stroke="#E0C680" stroke-opacity=".25" stroke-width="1"/></svg>';
  }

  function moonTonight() {
    var SYN = 29.530588853;
    var REF = Date.UTC(2000, 0, 6, 18, 14) / 864e5;
    var n = new Date();
    var tonight = new Date(n.getFullYear(), n.getMonth(), n.getDate(), 20, 0, 0);
    var days = tonight.getTime() / 864e5 - REF;
    var cycle = Math.floor(days / SYN);
    var age = days - cycle * SYN;
    var upper = [1.84566, 5.53699, 9.22831, 12.91963, 16.61096, 20.30228, 23.99361, 27.68493];
    var p = 0;
    while (p < upper.length && age >= upper[p]) p++;
    var phase = p % 8;
    var start = p === 8 ? upper[7] : (p === 0 ? 0 : upper[p - 1]);
    var dip = Math.min(3, Math.max(0, Math.floor(age - start)));
    var line = MOON_LINES[phase][(((cycle * 4 + dip) % 8) + 8) % 8];
    return { icon: MOON_ICONS[phase], name: MOON_NAMES[phase], line: line, age: age, syn: SYN };
  }

  // ---------- Render ----------

  function renderHeader() {
    var now = new Date();
    var h = now.getHours();
    var slot = h >= 5 && h < 12 ? "morning" : h >= 12 && h < 17 ? "afternoon" : h >= 17 && h < 22 ? "evening" : "night";
    $("hello").textContent = HELLO[slot];

    var target = dayNumber(new Date(now.getFullYear() + 1, 0, 1));
    var left = target - today;
    var isJan1 = now.getMonth() === 0 && now.getDate() === 1;
    special = isJan1 ? SPECIAL.first : (now.getMonth() <= 8 ? SPECIAL.after : (left === 1 ? SPECIAL.last : null));
    $("greeting").textContent = special ? special.tease : TEASES[today % TEASES.length];
    $("count").textContent = special && special.count ? special.count : left;
    $("count").classList.toggle("is-text", !!(special && special.count));
    $("cake").hidden = !(special && special.count);
    $("card").hidden = special === SPECIAL.first || special === SPECIAL.after;
    $("countLabel").hidden = !!(special && special.count);
    $("countLabel").textContent = special ? special.label : (left === 1 ? "day" : "days") + " until the new year";
    $("footnote").textContent = special ? special.foot : FOOTNOTES[today % FOOTNOTES.length];

    var m = moonTonight();
    $("moon").innerHTML = "";
    var pic = document.createElement("span");
    pic.className = "moonpic";
    pic.innerHTML = moonSVG(m.age, m.syn);
    $("moon").appendChild(pic);
    var b = document.createElement("b");
    b.textContent = "Moon tonight: " + m.name + ".";
    $("moon").appendChild(b);
    $("moon").appendChild(document.createTextNode(" " + m.line));
  }

  function renderTask() {
    if (!special && state.picks[tier] === undefined) { state.picks[tier] = choose(tier); saveState(); }
    var done = !!state.done[tier];
    $("takes").textContent = "Takes " + TIER_LABEL[tier];
    $("task").textContent = special ? special.tasks[tier] : TASKS[tier][state.picks[tier]];
    $("swapBtn").hidden = !!special;
    $("task").classList.toggle("is-done", done);
    $("thanks").textContent = done ? (state.thanks && state.thanks[tier]) || "" : (special ? special.lock : "");
    $("doneBtn").disabled = done;
    $("doneBtn").style.opacity = done ? "0.6" : "";
    $("doneBtn").style.cursor = done ? "default" : "";
    var buttons = document.querySelectorAll(".tier");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute("aria-pressed", String(buttons[i].getAttribute("data-tier") === tier));
    }
  }

  // ---------- Events ----------

  function burst(el) {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (var i = 0; i < 12; i++) {
      var p = document.createElement("span");
      p.className = "burst";
      p.style.left = cx + "px"; p.style.top = cy + "px";
      var d = 5 + Math.random() * 8; p.style.width = d + "px"; p.style.height = d + "px";
      document.body.appendChild(p);
      var a = (Math.PI * 2 * i) / 12 + Math.random() * 0.4, dist = 50 + Math.random() * 60;
      p.animate([
        { transform: "translate(-50%,-50%) scale(.4)", opacity: 1 },
        { transform: "translate(calc(-50% + " + Math.cos(a) * dist + "px), calc(-50% + " + Math.sin(a) * dist + "px)) scale(1.1)", opacity: 0 }
      ], { duration: 900 + Math.random() * 400, easing: "ease-out" }).onfinish = (function (n) { return function () { n.remove(); }; })(p);
    }
  }

  $("doneBtn").addEventListener("click", function () {
    if (state.done[tier]) return;
    burst($("doneBtn"));
    state.done[tier] = true;
    state.thanks = state.thanks || {};
    state.thanks[tier] = THANKS[(state.tally) % THANKS.length];
    state.tally += 1;
    var key = today + "-" + tier + "-" + state.stickers.length, freshIndex = -1;
    var ownedIdx = {};
    state.stickers.forEach(function (x) { ownedIdx[x.i] = true; });
    var nextIdx = -1;
    for (var q = 0; q < STICKERS.length; q++) if (!ownedIdx[q]) { nextIdx = q; break; }
    if (nextIdx < 0) {
      state.thanks[tier] += "\nEvery charm in the margins is already yours.";
    } else {
      state.stickers.push({ k: key, i: nextIdx });
      freshIndex = state.stickers.length - 1;
      var nm = STICKERS[state.stickers[freshIndex].i].name;
      var pw = STICKERS[state.stickers[freshIndex].i].power;
      state.thanks[tier] += "\nNew charm: " + nm + ". Power gained: " + pw.charAt(0).toLowerCase() + pw.slice(1);
    }
    saveState();
    renderTask();
    renderStickers(freshIndex);
  });

  $("swapBtn").addEventListener("click", function () {
    state.picks[tier] = choose(tier);
    state.done[tier] = false;
    saveState();
    renderTask();
  });

  var tierButtons = document.querySelectorAll(".tier");
  for (var i = 0; i < tierButtons.length; i++) {
    tierButtons[i].addEventListener("click", function (e) {
      tier = e.currentTarget.getAttribute("data-tier");
      renderTask();
    });
  }

  // Left open overnight? Roll over to the new day.
  setInterval(function () {
    if (dayNumber(new Date()) !== today) { startDay(); renderHeader(); renderTask(); }
  }, 60000);

  startDay();
  renderHeader();
  renderTask();
  renderStickers(-1);
  if (special === SPECIAL.first) setTimeout(function () { burst($("count")); }, 500);
})();
</script>
</body>
</html>
