<style>

  /* Bokeh dots: soft, glowing, gold */
  .star, .spark, .rule i, .burst, .glint {

  .sparkles { position: relative; display: inline-block; isolation: isolate; }

  .nojs { margin: 40px 0; font-size: 1.2rem; color: var(--ink); }

  }

      radial-gradient(circle at 24% 82%, rgba(110, 75, 35, 0.11) 0 3px, transparent 4px),

  }
  .paper::after {
    content: "";
    position: absolute; inset: 11px;
    border: 1px solid rgba(139, 101, 20, 0.5);
    border-radius: 3px;
    pointer-events: none;
  }
  .book { width: 90%; margin: 32px auto 0; padding: 16px 14px 18px; border: 1.5px dashed rgba(214, 176, 90, 0.5); border-radius: 16px; }
  .book h2 { margin: 0; font-size: 1.6rem; font-weight: 600; color: var(--gold); }
  .book-sub { margin: 2px 0 14px; font-size: 1.05rem; color: var(--muted); }
  .stickers { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 8px; }
  .sticker-wrap { position: relative; width: 2.35rem; height: 2.35rem; border-radius: 50%; cursor: default; }
  .sticker-wrap:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .sticker { width: 100%; height: 100%; transform: rotate(var(--r, 0deg)); filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.55)); transition: transform 0.15s; }
  .sticker-wrap:hover .sticker, .sticker-wrap:focus-visible .sticker { transform: rotate(var(--r, 0deg)) scale(1.18); }
  .sticker svg { display: block; width: 100%; height: 100%; }
  .sticker .bg { fill: var(--sb, #17383A); }
  .sticker .bgs { stroke: var(--sb, #1E3B2A); }
  .glint { position: absolute; z-index: 3; opacity: 0; }
  .sticker.pop { animation: peel 0.55s ease-out both; }

    from { transform: rotate(var(--r, 0deg)) scale(1.8); opacity: 0; }
    to { transform: rotate(var(--r, 0deg)) scale(1); opacity: 1; }
  }
  .tip {
    position: absolute; left: 50%; bottom: calc(100% + 8px); z-index: 5;
    transform: translateX(calc(-50% + var(--dx, 0px)));
    width: max-content; max-width: 13rem;
    padding: 5px 12px 6px; border-radius: 6px;
    background: #CDB78F; color: #2B1A22; border: 1px solid #A67C16;
    font-size: 1.02rem; line-height: 1.2; text-align: center;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.15s;
  }
  .tip b { display: block; font-size: 1.1rem; }
  .tip i { display: block; font-style: normal; color: #5C3A12; margin-top: 2px; }
  .sticker-wrap:hover .tip, .sticker-wrap:focus .tip { opacity: 1; visibility: visible; }
  .ghost .sticker { filter: none; }
  .ghost svg { opacity: var(--go, 0.25); }
  .ghost .bg { fill: transparent; stroke-dasharray: 3 2.6; }
  .ghost:hover .sticker, .ghost:focus-visible .sticker { transform: rotate(var(--r, 0deg)); }
  @media (prefers-reduced-motion: reduce) { .sticker.pop { animation: none; } }

  .tiers {
    display: inline-flex; gap: 2px; padding: 3px; margin-bottom: 16px;
    background: rgba(92, 18, 38, 0.08);
    border: 1px solid var(--gold);
    border-radius: 999px;
  }
  .tier {
    font-weight: 600; font-size: 0.95rem;
    padding: 6px 18px; border-radius: 999px;
    border: 0; background: transparent; color: var(--muted);
    cursor: pointer;
    transition: background .2s, color .2s, box-shadow .2s;
  }
  .tier:hover:not([aria-pressed="true"]) { color: var(--ink); }
  .tier[aria-pressed="true"] { background: var(--burgundy); color: #CDAA58; box-shadow: 0 1px 4px rgba(19, 25, 54, 0.4); }
  .takes { margin: 0; font-size: 1.05rem; letter-spacing: 0.02em; color: var(--burgundy); }
  .task { margin: 8px 0 20px; font-weight: 400; font-size: 1.15rem; line-height: 1.45; min-height: 5.2em; display: flex; align-items: center; justify-content: center; }
  .task.is-done { opacity: 0.6; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn {
    font-weight: 600; font-size: 1rem;
    padding: 12px 22px; border-radius: 16px;
    border: 1.5px solid transparent;
    cursor: pointer; color: #CDAA58;
    transition: transform .15s, box-shadow .15s, background .2s;
  }
  .btn.primary {
    background: linear-gradient(180deg, #702A4D 0%, var(--burgundy) 100%);
    border-color: var(--gold);
    box-shadow: 0 3px 0 rgba(19, 25, 54, 0.45), 0 6px 16px rgba(92, 18, 38, 0.5), 0 0 0 2px rgba(214, 176, 90, 0.35);
  }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    border-color: var(--gold);
    border-style: dashed;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn.ghost:hover { background: rgba(92, 18, 38, 0.08); }
  .btn.primary:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(15, 30, 56, 0.35); }
  .btn.ghost:active { transform: translateY(1px); }
  .btn:focus-visible, .tier:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .btn, .tier { transition: none; } .btn:hover:not(:disabled), .btn:active:not(:disabled) { transform: none; } }
  .thanks { margin: 14px 0 0; min-height: 1.5em; color: var(--ink); font-size: 1.1rem; white-space: pre-line; }

  .moon { margin: 30px 0 0; font-size: 1.15rem; color: var(--muted); }

  .moonpic { display: block; margin: 0 auto 8px; }
  .moonpic svg { display: block; margin: 0 auto; width: 2.55rem; height: 2.55rem; filter: drop-shadow(0 0 10px rgba(224, 198, 128, 0.35)); }
  .ask { margin: 34px 0 0; font-size: 1.1rem; color: var(--muted); }

  /* Mixed fonts: Cinzel capitals for headings and controls, Cormorant Garamond for everything you read */
  html { font-size: 92%; }
  body { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; letter-spacing: 0.01em; font-synthesis: none; }
  .hello, .count-label, .tier, .btn, .takes, .book h2, .moon b, .tip b { font-family: Cinzel, "Trajan Pro", Georgia, serif; letter-spacing: 0.03em; }
  .hello { font-size: 1.2rem; font-weight: 600; }
  .count-label { font-size: 1.15rem; font-weight: 400; }
  .tier { font-size: 0.82rem; font-weight: 600; }
  .btn { font-size: 0.86rem; font-weight: 600; }
  .takes { font-size: 0.9rem; font-weight: 400; }
  .book h2 { font-size: 1.3rem; font-weight: 600; }

  .thanks { font-size: 1.3rem; }
  .book-sub { font-size: 1.25rem; }

  @media (min-width: 820px) { html { font-size: 107%; } }

  /* ---- Manuscript typography on the night-sky palette ---- */
  .greeting { padding-bottom: 20px; margin-bottom: 26px; border-bottom: 1px solid rgba(214,176,90,.6); }

  .rule { display: block; height: 1px; width: 70%; margin: 24px auto 0; background: rgba(214,176,90,.6); }

  .tier, .btn { font-family: "Cinzel Decorative", Cinzel, serif; font-weight: 700; font-size: 0.78rem; letter-spacing: 0.05em; }
  .tiers { background: transparent; border: 1px solid rgba(214,176,90,.7); }
  .book { border: 1px solid rgba(214,176,90,.6); border-radius: 20px; }
  .book h2 { letter-spacing: 0.08em; }
  .greeting { border-bottom: none; padding-bottom: 6px; }
  .rule { display: none; }
  /* tweaks: calmer stars, softer tease, solid tab outline */
  body::before { opacity: .3; }

  .tiers { border: 1px solid #8A6B2C; }

  /* progress page */
  .navlink { margin: 22px 0 0; text-align: center; }
  .navlink a { font-family: Cinzel, serif; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); text-decoration: none; border-bottom: 1px solid rgba(214,176,90,.55); padding-bottom: 2px; }

  .psub { margin: 0 0 22px; font-size: 1.1rem; color: var(--muted); }
  .pstats { display: flex; gap: 10px; justify-content: center; }
  .pstat { flex: 1; border: 1px solid rgba(214,176,90,.6); border-radius: 16px; padding: 14px 6px 12px; }
  .pstat b { display: block; font-family: "Ingrid Darling", cursive; font-weight: 400; font-size: 3rem; line-height: 1; color: var(--gold-light); }
  .pstat span { display: block; margin-top: 8px; font-family: Cinzel, serif; font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .pstat { font: inherit; color: inherit; background: transparent; cursor: pointer; }

  .pstat:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 2px; }
  .pstat::after { content: "tap to open"; display: block; margin-top: 6px; font-size: .78rem; font-style: italic; color: var(--muted); opacity: .8; }

      p.animate([
        { transform: "translate(-50%,-50%) scale(.4)", opacity: 1 },
        { transform: "translate(calc(-50% + " + Math.cos(a) * dist + "px), calc(-50% + " + Math.sin(a) * dist + "px)) scale(1.1)", opacity: 0 }
      ], { duration: 900 + Math.random() * 400, easing: "ease-out" }).onfinish = (function (n) { return function () { n.remove(); }; })(p);
    }
  }

  $("doneBtn").addEventListener("click", function () {
    if (state.done[tier]) return;
    burst($("doneBtn"));
    // Anonymous count only (no task text): which length was finished.
    count("task-done-" + tier + "ish", "Task done (" + tier + "-ish)");
    state.done[tier] = true;
    state.thanks = state.thanks || {};
    state.thanks[tier] = THANKS[(state.tally) % THANKS.length];
    state.tally += 1;
    state.history.push({ d: new Date().toISOString().slice(0, 10), t: tier, x: $("task").textContent });
    if (state.history.length > 400) state.history.shift();
    var key = today + "-" + tier + "-" + state.stickers.length, freshIndex = -1;
    var ownedIdx = {};
    state.stickers.forEach(function (x) { ownedIdx[x.i] = true; });
    var nextIdx = -1;
    for (var q = 0; q < STICKERS.length; q++) if (!ownedIdx[q]) { nextIdx = q; break; }
    if (nextIdx < 0) {
      state.thanks[tier] += "\nEvery charm in the margins is already yours.";
    } else {
      state.stickers.push({ k: key, i: nextIdx });
      count("charm-collected", "Charm collected");
      freshIndex = state.stickers.length - 1;
      var nm = STICKERS[state.stickers[freshIndex].i].name;
      var pw = STICKERS[state.stickers[freshIndex].i].power;
      state.thanks[tier] += "\nNew charm: " + nm + ". Power gained: " + pw.charAt(0).toLowerCase() + pw.slice(1);
    }
    saveState();
    renderTask();
    renderStickers(freshIndex);
    if (freshIndex >= 0) { var fresh = document.querySelector("#stickers .sticker.pop"); sparkleCharm(fresh && fresh.parentNode); }
  });

  $("swapBtn").addEventListener("click", function () {
    state.picks[tier] = choose(tier);
    state.done[tier] = false;
    saveState();
    renderTask();
  });

  var tierButtons = document.querySelectorAll(".tier");
  for (var i = 0; i < tierButtons.length; i++) {
    tierButtons[i].addEventListener("click", function (e) {
      tier = e.currentTarget.getAttribute("data-tier");
      renderTask();
    });
  }

  // Left open overnight? Roll over to the new day.
  setInterval(function () {
    if (dayNumber(new Date()) !== today) { startDay(); renderHeader(); renderTask(); }
  }, 60000);

  function fmtDate(iso) {
    var p = iso.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]);
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  }
  function toggleList(btnId, listId, otherBtn, otherList) {
    var btn = $(btnId), list = $(listId), open = btn.getAttribute("aria-expanded") !== "true";
    btn.setAttribute("aria-expanded", open); list.hidden = !open;
    $(otherBtn).setAttribute("aria-expanded", "false"); $(otherList).hidden = true;
  }
  function renderProgress() {
    $("pTasks").textContent = state.tally;
    $("pCharms").textContent = state.stickers.length;
    $("pSub").textContent = state.tally === 0 ? "Nothing yet. The first small thing is the hardest, and it is very small."
      : state.stickers.length >= STICKERS.length ? "Every charm is yours. The goblin is quietly impressed."
      : "Small things, quietly adding up.";
    // what was done
    var tl = $("listTasks"); tl.innerHTML = "";
    var hist = (state.history || []).slice().reverse();
    hist.forEach(function (h) {
      var r = document.createElement("div"); r.className = "row";
      var w = document.createElement("span"); w.className = "when";
      w.textContent = fmtDate(h.d) + " · " + h.t + "-ish minutes";
      var t = document.createElement("span"); t.textContent = h.x;
      r.appendChild(w); r.appendChild(t); tl.appendChild(r);
    });
    if (!hist.length) { var e = document.createElement("p"); e.className = "empty"; e.textContent = "Nothing done yet. Today is a fine day to start."; tl.appendChild(e); }
    else if (hist.length < state.tally) { var n = document.createElement("p"); n.className = "note"; n.textContent = "Earlier tasks were done before the diary began."; tl.appendChild(n); }
    // what was collected
    var cl = $("listCharms"); cl.innerHTML = "";
    var BASES = { f: "#17383A", r: "#5A2630", b: "#3A2D4E" };
    state.stickers.slice().reverse().forEach(function (x) {
      var def = STICKERS[x.i % STICKERS.length];
      var r = document.createElement("div"); r.className = "row charm";
      var el = document.createElement("div"); el.className = "sticker";
      el.style.setProperty("--sb", BASES[def.base] || BASES.f);
      el.innerHTML = stickerSVG(def.art);
      var tx = document.createElement("div"), nm = document.createElement("b"), pw = document.createElement("i");
      nm.textContent = def.name.charAt(0).toUpperCase() + def.name.slice(1);
      pw.textContent = def.power;
      tx.appendChild(nm); tx.appendChild(pw); r.appendChild(el); r.appendChild(tx); cl.appendChild(r);
    });
    if (!state.stickers.length) { var e2 = document.createElement("p"); e2.className = "empty"; e2.textContent = "No charms yet. They arrive with each finished task."; cl.appendChild(e2); }
  }
  $("statTasks").addEventListener("click", function () { toggleList("statTasks", "listTasks", "statCharms", "listCharms"); });
  $("statCharms").addEventListener("click", function () { toggleList("statCharms", "listCharms", "statTasks", "listTasks"); });
  // "Remind me": a calendar event that repeats every 4 days until 31 Dec (files: remind-morning.ics, remind-lunch.ics, remind-evening.ics).
  var REMIND_YEAR = 2026;
  var REMIND_FILES = { "09:00": "remind-morning.ics", "12:30": "remind-lunch.ics", "19:00": "remind-evening.ics" };
  function isApple() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
  function googleCalURL(hhmm) {
    var t = hhmm.split(":"), start = REMIND_YEAR + "1018T" + t[0] + t[1] + "00";
    var mins = parseInt(t[0], 10) * 60 + parseInt(t[1], 10) + 10, pad = function (n) { return (n < 10 ? "0" : "") + n; };
    var end = REMIND_YEAR + "1018T" + pad(Math.floor(mins / 60)) + pad(mins % 60) + "00";
    return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent("Mildly Whimsical: one small, kind thing") +
      "&details=" + encodeURIComponent("One small thing is waiting for you. https://mildlywhimsical.com") +
      "&dates=" + start + "/" + end + "&recur=" + encodeURIComponent("RRULE:FREQ=DAILY;INTERVAL=4;UNTIL=" + REMIND_YEAR + "1231T235959Z");
  }
  $("remindBtn").addEventListener("click", function () {
    var open = $("remindTimes").hidden; $("remindTimes").hidden = !open; this.setAttribute("aria-expanded", open);
    $("remindMsg").textContent = "";
  });
  Array.prototype.forEach.call(document.querySelectorAll("#remindTimes .btn"), function (b) {
    b.addEventListener("click", function () {
      var t = b.getAttribute("data-t");
      count("remind-me", "Remind me tapped");
      if (isApple()) {
        $("remindMsg").textContent = "Opening your calendar…";
        window.location.href = REMIND_FILES[t];
      } else {
        $("remindMsg").textContent = "Opening your calendar in a new tab. Tap Save there.";
        window.open(googleCalURL(t), "_blank", "noopener");
      }
    });
  });

  function setView(on) {
    document.body.classList.toggle("on-progress", on);
    $("progressView").hidden = !on;
    if (on) { renderProgress(); $("remind").hidden = new Date().getMonth() <= 8 || new Date().getFullYear() !== REMIND_YEAR; window.scrollTo(0, 0); }
  }
  function route() { setView(location.hash === "#progress"); }
  window.addEventListener("hashchange", route);
  $("toProgress").addEventListener("click", function (e) {
    e.preventDefault(); setView(true); count("progress-opened", "Progress page opened");
    try { history.replaceState(null, "", "#progress"); } catch (x) {}
  });
  Array.prototype.forEach.call(document.querySelectorAll(".toToday"), function (a) {
    a.addEventListener("click", function (e) {
      e.preventDefault(); setView(false);
      try { history.replaceState(null, "", location.pathname + location.search); } catch (x) {}
    });
  });

  startDay();
  renderHeader();
  renderTask();
  renderStickers(-1);
  route();
  if (special === SPECIAL.first) setTimeout(function () { burst($("count")); }, 500);
})();
</script>
</body>
</html>
