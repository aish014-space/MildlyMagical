  // Eight lines per phase; they rotate so a line does not return for ~2 lunar months.
  var MOON_LINES = [
    [ // new
      `The moon is off duty tonight. Technically still there, like a colleague on holiday.`,
      `The sky has switched off the big light. Nobody is sure where the switch is.`,
      `No moon. An excellent evening for sulking in the dark with a clear conscience.`,
      `The moon is hiding. It is allowed. Everyone needs a day with the camera off.`,
      `A new moon: the universe’s way of saying “fresh start” without the pamphlets.`,
      `Perfect for quiet wishes, the kind that don’t require the universe to ask for references.`,
      `The moon has gone to refill. Please do the same with your tea.`,
      `Moonless tonight, which is the sky’s version of an out-of-office.`
    ],
    [ // waxing crescent
      `A slim crescent: the moon, one eyebrow raised at your to-do list.`,
      `The moon is thinking about getting involved. It has not yet decided.`,
      `A crescent, roughly the shape of a smile told to keep it brief.`,
      `A growing moon. Unlike your inbox, it is doing so on purpose.`,
      `The moon is a little bowl tonight, ready to hold any wishes that need holding.`,
      `The moon is trying a new look. Bold. Slightly slimming.`,
      `A good evening for starting things you will finish later, or never, but warmly.`,
      `The moon is a slim hammock tonight. Nobody is lying in it, but the offer stands.`
    ],
    [ // first quarter
      `Half a moon, exactly. Half-committed, which is relatable.`,
      `Half a moon tonight. It has done what it could, and so have you.`,
      `The sky’s version of “to be continued”.`,
      `The moon has cut itself in half, like a sandwich prepared by a sensible adult.`,
      `Optimists say half full. Witches say half the spell is already cast.`,
      `Neither one thing nor the other, much like a Wednesday.`,
      `Ideal for half-finished things. Gold stars for trying.`,
      `The moon is half there. Let the rest of the day be half there too.`
    ],
    [ // waxing gibbous
      `Nearly full, and visibly pleased with itself.`,
      `Almost a full moon, with a little nibbled off the side, like a biscuit.`,
      `The moon is filling out nicely. It has been eating, and good for it.`,
      `Gibbous sounds like a rude word. It is only geometry.`,
      `Nearly full tonight. Fair warning: the cats are already getting ideas.`,
      `The moon is building up to something. Possibly a performance review.`,
      `The last chapter before the big reveal.`,
      `A fat moon rising, like a pearl that has found its confidence.`
    ],
    [ // full
      `Full moon. If you feel odd, remember that it is the moon and not you. Mostly.`,
      `The sky’s biggest hint, and nobody takes it.`,
      `Witches are rumoured to be extra busy. The rest of us are just awake at 3 a.m.`,
      `Round, bright and unapologetic, like a good dumpling.`,
      `Excellent for howling, if you have had the week. Softly. There are neighbours.`,
      `Maximum brightness. Please do not attempt to find your keys by it.`,
      `The sky has switched on the big lamp and left it on all night, and nobody is going to mention the bill.`,
      `Sleep may be difficult. Think of it as a free late-night showing.`
    ],
    [ // waning gibbous
      `Past its peak and handling it with grace. Take notes.`,
      `The moon has begun its long, dignified wind-down. Feel free to join it.`,
      `The moon after the party, still wearing the hat.`,
      `A little less each night. Think of it as decluttering.`,
      `A good time to let go of one small thing. Perhaps an email.`,
      `The moon is easing off, and so may you. The universe approves.`,
      `Still plump, a little tired. Same, moon. Same.`,
      `Shrinking politely, like a guest who has noticed the time.`
    ],
    [ // last quarter
      `Half a moon again, but this one is tired.`,
      `Half the sky’s lamp is off. Save electricity by doing the same.`,
      `A quiet reminder that finishing things is optional but nice.`,
      `A half moon on its way out, like Friday afternoon, only astronomical.`,
      `The moon is tidying the edges tonight. Take the hint.`,
      `Ideal for wrapping up whatever you have been avoiding. Gently.`,
      `Half light, half dark, half way to a nap. A solid evening for the moon.`,
      `The moon is doing its end-of-month paperwork.`
    ],
    [ // waning crescent
      `Down to its last sliver of enthusiasm.`,
      `The thinnest of moons, like a fingernail paring with ambitions.`,
      `Nearly done, and quietly proud of it.`,
      `Almost no moon. A good night to go to bed early and call it astronomy.`,
      `A slim smile on its way out. Return it in kind.`,
      `Rest now. The new moon can handle the heavy lifting.`,
      `A thread of moon left. Pull it and the whole week may unravel. Don’t.`,
      `Candles, soft socks and a sensible bedtime are recommended.`
    ]
  ];

  // 41 per length, so nothing comes round again for at least five weeks.
  var TASKS = {
    "2": [
      `Drink a full glass of water, like a wizard downing a suspicious potion: with confidence and no questions.`,
      `Wash your face with warm water, slowly. Imagine the day’s nonsense going down the drain, because it is.`,
      `Put on moisturiser and sunscreen. Your face has to last you the rest of your life. Be polite to it.`,
      `Text a friend a single word: “Biscuits.” Then watch to see who understands.`,
      `Unclench your jaw. Lower your shoulders from around your ears. Return the ears to their usual position.`,
      `Take five slow breaths, in through the nose, out through the mouth, like a kettle that has made peace with itself.`,
      `Stand, stretch both arms at the ceiling and announce “Ta-da” to an empty room. The room won’t applaud. That’s fine.`,
      `Text someone: “Thinking of you. No reply needed.” A rare gift: a message with no homework.`,
      `Apply lip balm as if sealing a very important letter.`,
      `Look out of a window for a full minute. Count birds, clouds or the neighbours’ bins.`,
      `Roll your wrists and ankles in slow circles. They do a lot of unpaid work.`,
      `Rub in hand cream one finger at a time, as if casting a spell with very low stakes.`,
      `Say three things you did right today, out loud. “I woke up and wore trousers” counts.`,
      `Eat something fruity or green and chew it with the dignity of a small king.`,
      `Do a very small, very bad victory dance. Under thirty seconds. Witnesses optional.`,
      `Play the song that made you feel unstoppable at sixteen. Stay for the first chorus.`,
      `Brush your teeth standing on one leg. Balance is a skill, and so is dental care.`,
      `Run cool water over your wrists for twenty seconds. Folk wisdom says it helps. Folk are occasionally right.`,
      `Tell the mirror one nice thing about yourself. Use an accent if the sincerity is too much.`,
      `Tidy one square foot of your desk. Just one. The rest will wait; it is very patient.`,
      `Open a window and take three deep breaths of outside. Free, no subscription.`,
      `Send a friend a photo of something mildly ridiculous that you can see right now.`,
      `Massage your scalp with your fingertips for a minute, as if gently persuading an idea out.`,
      `Hug someone, a cushion, or a tree if neither is available. Count to six. Six is the minimum.`,
      `Make your tea or coffee, then sit down for the first three sips. Revolutionary.`,
      `Scrunch a scrap of paper and take a shot at the bin. Score yourself generously.`,
      `Put on your silliest socks. Nobody needs to know. The socks will know.`,
      `Write “Not today, nonsense” on a sticky note and put it where you will see it.`,
      `Tip your ear towards each shoulder, slowly. Make a small noise of relief. The noise is part of it.`,
      `Tell a houseplant, a pet or the kettle something good that happened this week.`,
      `Smell something lovely (coffee, soap, an orange peel) and give it thirty seconds of your full attention.`,
      `Put your phone face down and look at the ceiling for one minute. It has been waiting for this.`,
      `Have a sip of water, then say “ahhh” like in an advert for water. Commit to it.`,
      `Sing the first line of any song in the voice of a disappointed butler.`,
      `Take your shoes off and wiggle your toes. They have been in there all day, like tiny prisoners.`,
      `Wipe your phone screen and your glasses. Seeing clearly: underrated self-care.`,
      `Doodle something tiny in the margin of any paper nearby. A star, a snail, a teapot with opinions.`,
      `Write one full sentence in your best cursive. Any sentence. Let the loops do the talking.`,
      `If you had to name yourself today, what would you pick? “Gerald the Unbothered”, perhaps. Say it out loud.`,
      `If you were a snack, which would you be? Decide, then defend your choice to the nearest houseplant.`,
      `Send a friend a joke. Doesn’t have to be good. Groans count as replies.`
    ],
    "10": [
      `Read one article about something you know nothing about. Octopuses are a fine start: three hearts and no regrets.`,
      `Make a proper cup of tea and drink it without doing anything else. Yes, that is the whole task.`,
      `Write down three things you are looking forward to before New Year. Small ones count. Biscuits count.`,
      `Go outside and find five shades of green (or, this time of year, brown). Report to nobody.`,
      `Draw your coffee mug as if it were a minor nobleman.`,
      `Clear out one drawer. Everyone has one. You know the one.`,
      `Send a voice note to a friend you have been meaning to talk to. Conversation without eye contact.`,
      `Lie on the floor and stretch however your body suggests. Sound effects encouraged.`,
      `Read a poem aloud to yourself. Short ones preferred, dramatic ones permitted.`,
      `Make a playlist of five songs for the next hour. Include one you would only admit to under oath.`,
      `Write down everything in your head on one page, then close the notebook. The thoughts will wait outside, like polite vampires.`,
      `Assemble a fancy snack on a proper plate: something crunchy, something sweet, something cheesy. Eat it sitting down.`,
      `Walk around the block without your phone. Notice something you have never noticed. It is usually a door.`,
      `Learn to say “thank you” in a language you don’t speak, then say it to the nearest cat.`,
      `Build a tiny calm corner: a candle, a plant, a mug. Instant sanctuary, no planning permission.`,
      `Delete ten photos or apps from your phone. Lighter pockets, lighter soul.`,
      `Give your hands and face a small pamper: a mask or cream, and absolutely nothing else.`,
      `Watch a short video of baby goats, or any nature clip. Medicinal.`,
      `Write down a recipe from your childhood, as accurately as you can remember it.`,
      `Dance in the kitchen to two songs. The kettle may join in.`,
      `Read a chapter of the book you have been ignoring. It has been sulking on the shelf.`,
      `Plan one small treat for the weekend and put it in your calendar like a proper appointment.`,
      `Water your plants and trim one dead leaf. Check them for signs of drama.`,
      `Write a thank-you note to someone who helped you this year. Send it, or save it for later.`,
      `Do cat-cow ten times, then child’s pose for a minute. Cats approve of the first one.`,
      `Draw the view from your window in six lines or fewer.`,
      `Soak your feet or hold a hot water bottle for ten minutes with your eyes closed.`,
      `Sort your to-do list into three piles: do, delegate, and “the universe will sort it out”.`,
      `Look up the history of an everyday object (the paperclip, the umbrella) and tell someone about it at dinner.`,
      `Write a list of ten things that are going well. “Still here” counts.`,
      `Make a sandwich with unusual care, and cut it into triangles for no reason except joy.`,
      `Watch the sky from a window or doorstep for ten minutes. Clouds do their best work unobserved, but they will tolerate you.`,
      `Clear ten emails and unsubscribe from at least three. Freedom smells like fewer newsletters.`,
      `Invent a name for your current mood as if it were a new tea blend. “Slightly Frazzled Earl Grey”, for example.`,
      `Write a four-line joke about your inbox. Revenge is best served concisely.`,
      `Write a four-line joke about your favourite food. The food will not be offended.`,
      `Improvise a snack you would genuinely enjoy from whatever is in the cupboard. Name it something grand.`,
      `Make yourself a treat you loved as a kid: toast with something sweet, cereal, hot chocolate. Eat it with childish joy.`,
      `Call a parent or a friend, just to say hello. No agenda. Agendas are for meetings.`,
      `Write a joke. Any joke, any length, as long as one person could plausibly groan at it.`,
      `Doodle for ten minutes with no plan. Let the pen wander and see where it goes.`
    ]
  };

  var THANKS = [
    `Done, somehow. The universe is quietly delighted, though it would never say so.`,
    `Splendid. A small, kind thing, now safely entered in the great ledger of things that matter.`,
    `Well done. The day has just become a little more bearable, which is how most good things start.`,
    `Lovely. Somewhere a very small bell has rung, and it was rung for you.`,
    `Noted, and rather admired. Looking after oneself is a craft, and you are getting good at it.`,
    `Excellent. The rest of the day may now proceed at whatever speed you like.`,
    `That will do nicely. Small things are where the big ones keep their courage.`,
    `Marvellous. The world is gently improved, by roughly one person’s worth.`,
    `There. A tiny bit of magic, entirely your own, and no wand required.`,
    `Very good. You have been kind to someone today, and it was you, which counts double.`,
    `Done. The kettle, the moon and the cat all approve.`,
    `A fine piece of work. Do take a biscuit; the occasion rather demands it.`
  ];

  // Two fixed days: 31 December and 1 January. One calming task per length, no swapping.
  var SPECIAL = {
    last: {
      tasks: {
        "2": `Close your eyes and think of a highlight from this year that makes you smile.`,
        "10": `Make something warm to drink and sit somewhere comfortable, screens away, for ten minutes. Let the year wind down with you.`
      },
      tease: `Last day of the year. The to-do list can wait until next year. It is very good at that.`,
      foot: `* At midnight this page turns into a cake worth savouring. The management recommends a fork.`,
      label: `last day of the year`,
      lock: `Today’s task is locked in. Some days deserve to be kept simple.`
    },
    first: {
      count: `Happy New Year`,
      tasks: {
        "2": `Take one slow breath and say hello to the new year, out loud. Be polite. It is brand new.`,
        "10": `Have a slice of cake, or something cake-adjacent, and write down one small thing you would like more of this year.`
      },
      tease: `A whole new year, still in its wrapper. Be gentle with it.`,
      foot: `* As promised, the cake has arrived. The management still recommends a fork.`,
      label: `Welcome, dear human.`,
      lock: `Today’s task is locked in. A new year deserves a gentle start.`
    }
  };
  var special = null;

  var TIER_LABEL = { "2": "2 minutes", "10": "10 minutes" };
  var REPEAT_GAP_DAYS = 35;
  var STORE_KEY = "nearly-new-year.v1";

  // ---------- Helpers ----------

  function dayNumber(d) { return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); }
  function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function $(id) { return document.getElementById(id); }

  function loadState() {
    try {
      var s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && typeof s === "object") return s;
    } catch (e) {}
    return {};
  }
  function saveState() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  var state = loadState();
  state.seen = state.seen || {};      // seen[tier][idx] = last day shown
  state.tally = state.tally || 0;
  var today = dayNumber(new Date());
  var tier = "2";

  function startDay() {
    today = dayNumber(new Date());
    if (state.day !== today) {
      state.day = today;
      state.picks = {};
      state.done = {};
      saveState();
    }
  }

  // Tasks that involve gazing. Never on consecutive days in a length,
  // and never in both lengths on the same day.
  var STARE = /look out of a window|look at the ceiling|Watch the sky/;
  function isStare(t, idx) { return STARE.test(TASKS[t][idx]); }
  function stareBlocked(t) {
    var st = state.stare || (state.stare = {});
    var mine = st[t] || (st[t] = {});
    var prevPick = state.picks[t];
    if (mine[today - 1] || mine[today]) return true;
    if (prevPick !== undefined && isStare(t, prevPick)) return true;
    for (var o in TASKS) {
      if (o !== t && st[o] && st[o][today]) return true;
    }
    return false;
  }

  // Choose a task not shown in the last 5 weeks. The day number sets the
  // starting point, so an untouched run never repeats inside 36 days.
  function choose(t) {
    var n = TASKS[t].length;
    var seen = state.seen[t] || (state.seen[t] = {});
    var base = ((today % n) + n) % n;
    var best = -1, oldest = Infinity;
    var noStare = stareBlocked(t);
    var current = state.picks[t];
    for (var i = 0; i < n; i++) {
      var idx = (base + i) % n;
      if (noStare && isStare(t, idx)) continue;
      var last = seen[idx];
      if (last === undefined || today - last >= REPEAT_GAP_DAYS) { best = idx; break; }
      if (idx !== current && last < oldest) { oldest = last; best = idx; }
    }
    if (best < 0) best = base;
    seen[best] = today;
    if (isStare(t, best)) state.stare[t][today] = true;
    return best;
  }

  // ---------- Moon ----------

  function moonTonight() {
    var SYN = 29.530588853;
    var REF = Date.UTC(2000, 0, 6, 18, 14) / 864e5;
    var n = new Date();
    var tonight = new Date(n.getFullYear(), n.getMonth(), n.getDate(), 20, 0, 0);
    var days = tonight.getTime() / 864e5 - REF;
    var cycle = Math.floor(days / SYN);
    var age = days - cycle * SYN;
    var upper = [1.84566, 5.53699, 9.22831, 12.91963, 16.61096, 20.30228, 23.99361, 27.68493];
    var p = 0;
    while (p < upper.length && age >= upper[p]) p++;
    var phase = p % 8;
    var start = p === 8 ? upper[7] : (p === 0 ? 0 : upper[p - 1]);
    var dip = Math.min(3, Math.max(0, Math.floor(age - start)));
    var line = MOON_LINES[phase][(((cycle * 4 + dip) % 8) + 8) % 8];
    return { icon: MOON_ICONS[phase], name: MOON_NAMES[phase], line: line };
  }

  // ---------- Render ----------

  function renderHeader() {
    var now = new Date();
    var h = now.getHours();
    var slot = h >= 5 && h < 12 ? "morning" : h >= 12 && h < 17 ? "afternoon" : h >= 17 && h < 22 ? "evening" : "night";
    $("hello").textContent = HELLO[slot];

    var target = dayNumber(new Date(now.getFullYear() + 1, 0, 1));
    var left = target - today;
    special = (now.getMonth() === 0 && now.getDate() === 1) ? SPECIAL.first : (left === 1 ? SPECIAL.last : null);
    $("greeting").textContent = special ? special.tease : TEASES[today % TEASES.length];
    $("count").textContent = special && special.count ? special.count : left;
    $("count").classList.toggle("is-text", !!(special && special.count));
    $("cake").hidden = !(special && special.count);
    $("card").hidden = special === SPECIAL.first;
    $("countLabel").hidden = !!(special && special.count);
    $("countLabel").textContent = special ? special.label : (left === 1 ? "day" : "days") + " until the new year";
    $("footnote").textContent = special ? special.foot : FOOTNOTES[today % FOOTNOTES.length];

    var m = moonTonight();
    $("moon").innerHTML = "";
    var b = document.createElement("b");
    b.textContent = m.icon + " Moon tonight: " + m.name + ".";
    $("moon").appendChild(b);
    $("moon").appendChild(document.createTextNode(" " + m.line));
  }

  function renderTask() {
    if (!special && state.picks[tier] === undefined) { state.picks[tier] = choose(tier); saveState(); }
    var done = !!state.done[tier];
    $("takes").textContent = "Takes about " + TIER_LABEL[tier];
    $("task").textContent = special ? special.tasks[tier] : TASKS[tier][state.picks[tier]];
    $("swapBtn").hidden = !!special;
    $("task").classList.toggle("is-done", done);
    $("thanks").textContent = done ? (state.thanks && state.thanks[tier]) || "" : (special ? special.lock : "");
    $("doneBtn").disabled = done;
    $("doneBtn").style.opacity = done ? "0.6" : "";
    $("doneBtn").style.cursor = done ? "default" : "";
    var buttons = document.querySelectorAll(".tier");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute("aria-pressed", String(buttons[i].getAttribute("data-tier") === tier));
    }
    $("tally").textContent = state.tally
      ? "Small things done so far: " + state.tally + ". Tiny, but cumulative."
      : "";
  }

  // ---------- Events ----------

  function burst(el) {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (var i = 0; i < 12; i++) {
      var p = document.createElement("span");
      p.className = "burst";
      p.textContent = i % 2 ? "✦" : "✧";
      p.style.left = cx + "px"; p.style.top = cy + "px";
      p.style.fontSize = (10 + Math.random() * 12) + "px";
      document.body.appendChild(p);
      var a = (Math.PI * 2 * i) / 12 + Math.random() * 0.4, dist = 50 + Math.random() * 60;
      p.animate([
        { transform: "translate(-50%,-50%) scale(.4)", opacity: 1 },
        { transform: "translate(calc(-50% + " + Math.cos(a) * dist + "px), calc(-50% + " + Math.sin(a) * dist + "px)) scale(1.1)", opacity: 0 }
      ], { duration: 900 + Math.random() * 400, easing: "ease-out" }).onfinish = (function (n) { return function () { n.remove(); }; })(p);
    }
  }

  $("doneBtn").addEventListener("click", function () {
    if (state.done[tier]) return;
    burst($("doneBtn"));
    state.done[tier] = true;
    state.thanks = state.thanks || {};
    state.thanks[tier] = THANKS[(state.tally) % THANKS.length];
    state.tally += 1;
    saveState();
    renderTask();
  });

  $("swapBtn").addEventListener("click", function () {
    state.picks[tier] = choose(tier);
    state.done[tier] = false;
    saveState();
    renderTask();
  });

  var tierButtons = document.querySelectorAll(".tier");
  for (var i = 0; i < tierButtons.length; i++) {
    tierButtons[i].addEventListener("click", function (e) {
      tier = e.currentTarget.getAttribute("data-tier");
      renderTask();
    });
  }

  // Left open overnight? Roll over to the new day.
  setInterval(function () {
    if (dayNumber(new Date()) !== today) { startDay(); renderHeader(); renderTask(); }
  }, 60000);

  startDay();
  renderHeader();
  renderTask();
  if (special === SPECIAL.first) setTimeout(function () { burst($("count")); }, 500);
})();
</script>
</body>
</html>
